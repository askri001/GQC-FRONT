<div class="login-container">
  <div class="login-background">
    <div class="bg-pattern"></div>
  </div>

  <div class="login-content">

    <div class="login-header">
      <div class="logo">
        <mat-icon>account_balance</mat-icon>
      </div>
      <h1>BNA - Gestion de Contentieux</h1>
      <p>Banque Nationale Agricole - Système de Gestion</p>
    </div>

    <mat-card class="login-card">

      <mat-card-content>

        <h2>Connexion BNA</h2>

        <form (ngSubmit)="onLogin()" class="login-form">

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Nom d'utilisateur</mat-label>
            <input matInput [(ngModel)]="username" name="username">
            <mat-icon matPrefix>person</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Mot de passe</mat-label>
            <input matInput [type]="hidePassword() ? 'password' : 'text'"
                   [(ngModel)]="password"
                   name="password">
            <mat-icon matPrefix>lock</mat-icon>
            <button mat-icon-button matSuffix type="button"
                    (click)="hidePassword.set(!hidePassword())"
                    [attr.aria-label]="hidePassword() ? 'Afficher le mot de passe' : 'Masquer le mot de passe'">
              <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>

          @if (errorMessage()) {
            <div class="error-message">
              {{ errorMessage() }}
            </div>
          }

          <button mat-raised-button color="primary"
                  type="submit"
                  class="login-btn"
                  [disabled]="loading()">

            @if (loading()) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              Se connecter
            }

          </button>

        </form>

      </mat-card-content>

    </mat-card>

  </div>
</div>
